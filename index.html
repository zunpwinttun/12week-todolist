<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="./style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pen</title>
  </head>
  <body>
    <h1 id="title">오늘의 할 일</h1>

    <p id="message">할 일을 관리해 보세요.</p>

    <input id="todoInput"
           type="text"
           placeholder="할 일을 입력하세요">

    <button onclick="addTodo()">추가</button>

    <!-- 기능 3: 입력창 아래 할 일 개수 표시 -->
    <p id="todoCount">전체 2개 / 완료 0개</p>

    <ul id="todoList">
      <li>
        <span class="todo-text">JavaScript 공부하기</span>
        <button class="delete-btn">삭제</button>
      </li>
      <li>
        <span class="todo-text">과제 제출하기</span>
        <button class="delete-btn">삭제</button>
      </li>
    </ul>

    <script src="./script.js"></script>
  </body>
</html>
